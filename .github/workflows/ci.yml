name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 의존성 설치
        run: npm ci || npm install --no-audit --no-fund
      - name: 타입 검사
        run: npm run lint
      - name: 단위 시험
        run: npm test
      - name: 단위 시험 — 다른 시간대에서도 같은 답(기한·단속 시간은 한국 시각)
        run: TZ=America/Los_Angeles npm test
      - name: 빌드
        run: npm run build
