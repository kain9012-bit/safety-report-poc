name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 의존성 설치
        run: npm ci || npm install --no-audit --no-fund
      - name: 타입 검사
        run: npm run lint
      - name: 빌드
        run: npm run build
